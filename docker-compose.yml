services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bowlyng-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  bowlinghub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bowlyng-bowlinghub
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto

  esp-sim:
    profiles: ["sim"]
    build: ./ESP/simulator
    container_name: bowlyng-esp-sim
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
